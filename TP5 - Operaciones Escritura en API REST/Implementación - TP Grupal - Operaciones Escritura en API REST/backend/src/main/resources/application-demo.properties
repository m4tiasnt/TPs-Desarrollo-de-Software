# Perfil de demo: recarga los datos de ejemplo en cada arranque.
#
#   ./gradlew bootRun --args='--spring.profiles.active=demo'        (Linux/Mac)
#   gradlew.bat bootRun --args=--spring.profiles.active=demo        (Windows)
#
# En IntelliJ: Run > Edit Configurations... > Active profiles: demo
# (o "VM options: -Dspring.profiles.active=demo").
#
# ATENCION: poblar_db.sql empieza con TRUNCATE, asi que este perfil BORRA todos
# los datos cargados y vuelve a insertar el juego de ejemplo. No usarlo en el
# arranque normal: sin el perfil, el script no se ejecuta nunca.

# Ejecuta los scripts de inicializacion tambien contra PostgreSQL
# (por defecto spring.sql.init.mode=embedded).
spring.sql.init.mode=always

# classpath: para que no dependa del working directory (bootRun usa backend/,
# IntelliJ usa la raiz del proyecto). Es una COPIA de backend/db/poblar_db.sql:
# si cambias los datos de ejemplo, actualiza los dos archivos.
spring.sql.init.data-locations=classpath:poblar_db.sql

# Espera a que Hibernate cree/actualice las tablas antes de correr el script
spring.jpa.defer-datasource-initialization=true
