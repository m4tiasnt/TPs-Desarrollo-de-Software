plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.facturaarca'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

springBoot {
    mainClass = 'com.facturaarca.FacturaArcaApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    // PostgreSQL Driver
    implementation 'org.postgresql:postgresql:42.7.3'

    // JPA y Hibernate
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.hibernate.orm:hibernate-core'

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    // iText para generación de PDFs 
    implementation 'com.itextpdf:itext-core:9.2.0'

    // Apache POI para generación de Excel 
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // BouncyCastle para firma PKCS#7 / CMS (WSAA AFIP/ARCA)
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'

    // Dependencias JAX-WS (WSFE v1)
    implementation 'jakarta.xml.ws:jakarta.xml.ws-api:4.0.0'
    implementation 'com.sun.xml.ws:jaxws-rt:4.0.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
