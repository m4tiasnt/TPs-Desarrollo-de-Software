spring.application.name=facturaarca
spring.datasource.url=jdbc:postgresql://localhost:5432/factura_arca
spring.datasource.username=postgres
spring.datasource.password=milanesa123

# Generación del esquema de base de datos:
spring.jpa.hibernate.ddl-auto=update

# Opcional para ver las consultas SQL en la consola
spring.jpa.show-sql=true

# Esquema de la aplicación: todas las entidades mapean a "model" (@Table(schema = "model")).
spring.jpa.properties.hibernate.default_schema=model
# Crea el esquema "model" automáticamente al iniciar, si todavía no existe.
spring.jpa.properties.jakarta.persistence.create-database-schemas=true

# Directorio donde se generan los reportes PDF
app.reportes.dir=reportes

# Configuración para poblar la base de datos al iniciar
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:poblar_db.sql
spring.jpa.defer-datasource-initialization=true

# Configuración ARCA / AFIP (Homologación)
# Se requiere definir la variable de entorno ARCA_CUIT sin valores por defecto
arca.cuit=${ARCA_CUIT}
arca.key.path=backend/afip_private.key
arca.cert.path=backend/afip_certificado.crt
