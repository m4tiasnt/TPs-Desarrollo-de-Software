spring.application.name=facturaarca
spring.datasource.url=jdbc:postgresql://localhost:5432/factura_arca
spring.datasource.username=postgres
spring.datasource.password=milanesa123

# CONFIGURACIÓN CLAVE PARA QUE SE CREEN LAS TABLAS:
spring.jpa.hibernate.ddl-auto=update

# Opcional para ver las consultas SQL en la consola
spring.jpa.show-sql=true

# Esquema de la aplicación: todas las entidades mapean a "model" (@Table(schema = "model")).
spring.jpa.properties.hibernate.default_schema=model
# Crea el esquema "model" automáticamente al iniciar, si todavía no existe.
spring.jpa.properties.jakarta.persistence.create-database-schemas=true

# Directorio donde se generan los reportes PDF
app.reportes.dir=reportes
